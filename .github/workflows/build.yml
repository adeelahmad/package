name: build
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: make test
      - run: make build
      - uses: actions/upload-artifact@v4
        with: { name: binaries, path: bin/ }
